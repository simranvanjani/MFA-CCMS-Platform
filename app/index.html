<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Consular Case Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js"></script>
<style>
:root{
  --ground:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb;
  --ink:#182233; --muted:#5c6879; --faint:#8a96a6;
  --border:#e3e8ef; --border-strong:#cdd5e0;
  --brand:#1f4e8c; --brand-ink:#173c6d; --brand-soft:#e8eff9;
  --ok:#137a4d; --ok-bg:#e2f2ea; --warn:#9a5810; --warn-bg:#f9edd8; --crit:#b23b3b; --crit-bg:#f7e4e4;
  --shadow:0 1px 2px rgba(24,34,51,.06), 0 4px 16px rgba(24,34,51,.05);
  --font:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0e1420; --surface:#161e2b; --surface-2:#1b2431;
  --ink:#e8edf4; --muted:#9aa7b8; --faint:#6d7a8c;
  --border:#28313f; --border-strong:#3a4655;
  --brand:#6d9fe0; --brand-ink:#a9c6ee; --brand-soft:#1a2c46;
  --ok:#54c08a; --ok-bg:#123528; --warn:#dba24a; --warn-bg:#3a2d12; --crit:#e57373; --crit-bg:#3a2020;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --ground:#0e1420; --surface:#161e2b; --surface-2:#1b2431;
  --ink:#e8edf4; --muted:#9aa7b8; --faint:#6d7a8c;
  --border:#28313f; --border-strong:#3a4655;
  --brand:#6d9fe0; --brand-ink:#a9c6ee; --brand-soft:#1a2c46;
  --ok:#54c08a; --ok-bg:#123528; --warn:#dba24a; --warn-bg:#3a2d12; --crit:#e57373; --crit-bg:#3a2020;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
a{color:var(--brand);text-decoration:none}
.shell{display:grid;grid-template-columns:224px 1fr;min-height:100%}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:2px;padding:16px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 16px;border-bottom:1px solid var(--border);margin-bottom:10px}
.brand .mark{width:30px;height:30px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.brand .t{font-weight:600;font-size:14px;letter-spacing:.2px}
.brand .s{font-size:11px;color:var(--faint)}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--muted);font-weight:500;border:none;background:none;width:100%;text-align:left;font-size:13.5px}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav.active{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.nav .ic{width:18px;text-align:center}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:9px;padding:8px 10px;border-top:1px solid var(--border);color:var(--muted);font-size:12.5px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:600;font-size:11px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--ground) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:14px}
.topbar h1{font-size:16px}
.crumb{color:var(--faint);font-size:12.5px}
.content{padding:22px 32px 48px;width:100%}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.count{font-size:13px;color:var(--muted)}.count b{color:var(--ink)}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 12px;color:var(--faint)}
.search input{border:none;background:none;outline:none;color:var(--ink);font-family:inherit;font-size:13.5px;width:100%}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.fsel{appearance:none;-webkit-appearance:none;background:var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238a96a6'/></svg>") no-repeat right 10px center;border:1px solid var(--border);border-radius:9px;padding:8px 28px 8px 12px;font-family:inherit;font-size:12.5px;color:var(--ink);cursor:pointer}
.fsel:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.fclear{background:none;border:1px solid var(--border);border-radius:9px;padding:8px 12px;font-size:12.5px;color:var(--muted)}
.fclear:hover{color:var(--brand);border-color:var(--brand)}
.seg{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:8px 12px;font-size:12.5px;color:var(--muted);border-left:1px solid var(--border)}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.tablecard{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:11px 16px;border-bottom:1px solid var(--border);background:var(--surface-2)}
tbody td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13.5px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.ref{font-family:var(--mono);font-weight:500;font-size:13px}
.sub{color:var(--faint);font-size:12px}
.right{text-align:right}
.viewbtn{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:7px;padding:6px 14px;font-size:12.5px;font-weight:500}
.viewbtn:hover{border-color:var(--brand);color:var(--brand)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:100px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.closed{color:var(--ok);background:var(--ok-bg)}
.pill.pending{color:var(--warn);background:var(--warn-bg)}
.pill.hold{color:var(--muted);background:var(--surface-2)}
.pill.progress{color:var(--brand-ink);background:var(--brand-soft)}
.statuslbl{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:7px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted)}
.chip.agency{background:var(--brand-soft);border-color:transparent;color:var(--brand-ink)}
.chip.crit{background:var(--crit-bg);color:var(--crit);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:12px 8px 0;color:var(--muted);font-size:12.5px}
.pager button{border:1px solid var(--border-strong);background:var(--surface);border-radius:7px;padding:6px 11px;font-size:12.5px;color:var(--ink)}
.pager button:disabled{opacity:.45;cursor:default}
.recwrap{display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start}
.back{display:inline-flex;align-items:center;gap:7px;border:none;background:none;color:var(--muted);font-size:13px;padding:0;margin-bottom:14px}
.back:hover{color:var(--brand)}
.rechead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:6px}
.rechead h2{font-size:22px;font-family:var(--mono);font-weight:600;letter-spacing:-.01em}
.recmeta{color:var(--muted);font-size:13px;margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dot{width:3px;height:3px;border-radius:50%;background:var(--border-strong)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);margin-bottom:16px}
.card>.hd{padding:13px 18px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
.card>.hd .k{font-size:11px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.card>.bd{padding:16px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:2px 24px}
.field{padding:9px 0;border-bottom:1px solid var(--border)}
.field .l{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.field .v{font-size:13.5px;font-weight:500}
.masked{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-style:italic}
.locknote{font-size:10.5px;color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-style:normal}
.sectlabel{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.l2{margin:0 0 16px}.l2:last-child{margin-bottom:0}
.l2 .t{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600;margin-bottom:4px}
.l2 p{margin:0;color:var(--ink);font-size:13.5px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px;cursor:pointer}
.steps li:last-child{border-bottom:none}
.steps .box{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border-strong);display:grid;place-items:center;color:var(--brand);font-size:12px;margin-top:1px}
.steps li.done .box{background:var(--brand);border-color:var(--brand);color:#fff}
.steps li.done span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--border-strong)}
.composer textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:11px 12px;font-family:inherit;font-size:13px;resize:vertical;min-height:76px;background:var(--surface-2);color:var(--ink);outline:none}
.composer textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.composer .row{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.composer .hint{font-size:11.5px;color:var(--faint)}
.primary{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600}
.primary:hover{background:var(--brand-ink)}
.primary:disabled{opacity:.6;cursor:default}
.feed{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.note{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--border)}
.note .av{flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);display:grid;place-items:center;font-size:11px;font-weight:600}
.note .meta{font-size:12px;margin-bottom:2px}.note .meta b{font-weight:600}
.note .meta .ts{color:var(--faint);font-family:var(--mono);font-size:11px;margin-left:6px}
.note .txt{font-size:13px}
.empty{color:var(--faint);font-size:12.5px;padding:14px 0;text-align:center}
.kpirow{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kpi-accent,var(--brand))}
.kpi .n{font-size:30px;font-weight:600;font-family:var(--mono);letter-spacing:-.02em}
.kpi .k{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .delta{font-size:11.5px;font-weight:600;margin-top:8px;display:inline-flex;align-items:center;gap:4px}
.kpi .delta.up{color:var(--ok)}.kpi .delta.down{color:var(--crit)}.kpi .delta.flat{color:var(--muted)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chartcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px}
.chartcard.wide{grid-column:1 / -1}
.chartcard h3{font-size:14px;font-weight:600;margin-bottom:2px}
.chartcard .sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.chartcard .canvas-wrap{position:relative;height:280px}
@media (max-width:900px){.charts{grid-template-columns:1fr}.kpirow{grid-template-columns:repeat(2,1fr)}}
#v-ask.show{display:flex;flex-direction:column;padding:0;max-width:none;height:calc(100dvh - 58px)}
.askwrap{display:grid;grid-template-columns:250px 1fr;flex:1;min-height:0}
.convrail{border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.newchat{background:var(--brand);color:#fff;border:none;border-radius:9px;padding:10px 12px;font-size:13px;font-weight:600;width:100%}
.newchat:hover{background:var(--brand-ink)}
.convhdr{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:14px 4px 4px}
.convs{display:flex;flex-direction:column;gap:2px}
.convitem{text-align:left;border:none;background:none;color:var(--muted);padding:9px 10px;border-radius:8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;cursor:pointer}
.convitem:hover{background:var(--surface-2);color:var(--ink)}
.convitem.active{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.chatmain{display:flex;flex-direction:column;min-width:0;min-height:0}
.chat{max-width:820px;width:100%;margin:0 auto;flex:1;overflow-y:auto;padding:24px 24px 8px}
.emptyq{max-width:820px;margin:8px auto 0}
.emptyq h2{font-size:20px;margin-bottom:6px}
.emptyq p{color:var(--muted);margin:0 0 16px}
.suggests{display:flex;flex-direction:column;gap:8px}
.suggest{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--ink);cursor:pointer}
.suggest:hover{border-color:var(--brand);background:var(--surface-2)}
.suggest .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);display:block;margin-bottom:2px}
.msg{display:flex;gap:11px;margin-bottom:18px}
.msg .av{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:600}
.msg.u .av{background:var(--surface-2);border:1px solid var(--border)}
.msg.a .av{background:var(--brand);color:#fff}
.bubble{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 15px;box-shadow:var(--shadow)}
.msg.u .bubble{background:var(--surface-2);box-shadow:none}
.routetag{display:inline-block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--brand-ink);background:var(--brand-soft);padding:2px 8px;border-radius:6px;margin-bottom:7px;font-weight:600}
.askbar{display:flex;gap:9px;max-width:820px;width:100%;margin:0 auto;padding:14px 24px;border-top:1px solid var(--border)}
.askbar input{flex:1;border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-family:inherit;font-size:13.5px;background:var(--surface);color:var(--ink);outline:none}
.askbar input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.view{display:none}.view.show{display:block}
.demoflag{font-size:11px;color:var(--faint);border:1px dashed var(--border-strong);border-radius:6px;padding:2px 8px}
.loading{color:var(--faint);font-size:13px;padding:20px}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .sidebar{flex-direction:row;align-items:center;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:8px 12px}
  .brand{border:none;margin:0;padding:0 12px 0 4px}.brand .s{display:none}
  .nav{width:auto}.spacer,.who{display:none}
  .recwrap{grid-template-columns:1fr}.grid2,.charts,.kpirow{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="mark">C</div><div><div class="t">Case Console</div><div class="s">MFA · Consular Ops</div></div></div>
    <button class="nav active" data-view="cases"><span class="ic">🗂️</span> Cases</button>
    <button class="nav" data-view="ask"><span class="ic">💬</span> Ask</button>
    <button class="nav" data-view="dash"><span class="ic">📊</span> Dashboard</button>
    <div class="spacer"></div>
    <div class="who"><div class="avatar" id="meav">··</div><div id="meid">officer@mfa.gov.sg</div></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <h1 id="pgttl">Cases</h1><span class="crumb" id="pgcrumb"></span>
      <div style="flex:1"></div><span class="demoflag">Demo · synthetic data</span>
    </div>

    <div class="content view show" id="v-list">
      <div class="toolbar">
        <div class="search">🔎 <input id="q" placeholder="Search by reference no., name, type, country, description…"></div>
      </div>
      <div class="filters">
        <select id="f_country" class="fsel"><option value="">All countries</option></select>
        <select id="f_type" class="fsel"><option value="">All case types</option></select>
        <select id="f_flag" class="fsel"><option value="">All flags</option></select>
        <select id="f_status" class="fsel"><option value="">Any status</option></select>
        <select id="f_sort" class="fsel">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="res_asc">Resolution: fastest</option>
          <option value="res_desc">Resolution: slowest</option>
        </select>
        <button id="f_clear" class="fclear">Clear</button>
        <span class="count" style="margin-left:auto"><b id="tot">—</b> cases · newest first</span>
      </div>
      <div class="tablecard">
        <table><thead><tr><th>Case</th><th>Type</th><th>Location</th><th>Status</th><th>Created</th><th>Res.</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="7" class="loading">Loading cases…</td></tr></tbody></table>
      </div>
      <div class="pager"><span id="pginfo"></span>
        <button id="first">⏮ First</button><button id="prev">◀ Prev</button><button id="next">Next ▶</button></div>
    </div>

    <div class="content view" id="v-rec"><div id="recbody"></div></div>

    <div class="content view" id="v-ask">
      <div class="askwrap">
        <aside class="convrail">
          <button id="newchat" class="newchat">+ New chat</button>
          <div class="convhdr">Recent</div>
          <div id="convs" class="convs"></div>
        </aside>
        <div class="chatmain">
          <div class="chat" id="chat"></div>
          <div class="askbar"><input id="askin" placeholder="Ask across cases, find similar cases, or ask for a procedure…"><button class="primary" id="asksend">Send</button></div>
        </div>
      </div>
    </div>

    <div class="content view" id="v-dash"><div id="dashbody"><div class="loading">Loading…</div></div></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>(s??"").toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inits=e=>{const p=(e||"o").split(/[@.]/);return ((p[0][0]||"")+(p[1]?p[1][0]:"")).toUpperCase();};
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const FLAGCLS={'scam':'crit','welfare concern':'warn','MP/POH escalation':'agency','language barrier':''};

let page=0, pages=1;

/* nav */
const TITLES={cases:'Cases',ask:'Ask',dash:'Dashboard'};
function setView(v){
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('show'));
  document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===v));
  $('#pgttl').textContent=TITLES[v]; $('#pgcrumb').textContent='';
  $('#v-'+(v==='cases'?'list':v)).classList.add('show');
  if(v==='dash')loadDash();
  if(v==='ask'){loadConvs(); if(!chatEl().querySelector('.msg') && !chatEl().querySelector('.emptyq')) emptyState();}
}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>setView(n.dataset.view));

/* cases list */
function pillCls(s){s=(s||'').toLowerCase();if(s==='closed')return 'closed';if(s.includes('hold'))return 'hold';if(s.includes('progress'))return 'progress';return 'pending';}
function _filters(){
  return {q:$('#q').value.trim(), country:$('#f_country').value, case_type:$('#f_type').value,
          flag:$('#f_flag').value, status:$('#f_status').value, sort:$('#f_sort').value};
}
async function loadFilters(){
  try{
    const o=await (await fetch('/api/filters')).json();
    const fill=(id,arr)=>{const s=$(id);(arr||[]).forEach(v=>{const op=document.createElement('option');op.value=v;op.textContent=v;s.appendChild(op);});};
    fill('#f_country',o.country); fill('#f_type',o.case_type); fill('#f_flag',o.flag); fill('#f_status',o.status);
  }catch(e){/* dropdowns stay as "All"; search still works */}
}
async function loadCases(p){
  $('#rows').innerHTML='<tr><td colspan="7" class="loading">Loading…</td></tr>';
  const params=new URLSearchParams(Object.assign({page:p}, _filters()));
  let d;
  try{
    const res=await fetch('/api/cases?'+params.toString());
    if(!res.ok) throw new Error('HTTP '+res.status);
    d=await res.json();
  }catch(e){
    $('#rows').innerHTML=`<tr><td colspan="7" class="loading">Couldn't load cases (${esc(e.message)}). <a href="#" onclick="loadCases(${p});return false;">Retry</a></td></tr>`;
    return;
  }
  page=d.page; pages=Math.max(1,Math.ceil(d.total/d.page_size));
  $('#tot').textContent=d.total;
  $('#pginfo').textContent=`Page ${page+1} of ${pages}`;
  $('#first').disabled=$('#prev').disabled=page===0;
  $('#next').disabled=page>=pages-1;
  if(!d.rows.length){$('#rows').innerHTML='<tr><td colspan="7" class="loading">No cases match these filters.</td></tr>';return;}
  $('#rows').innerHTML=d.rows.map(r=>{
    const pill=pillCls(r.Status);
    return `<tr>
      <td><div class="ref">${esc(r.Case_Ref)}</div></td>
      <td>${esc(r.Case_Type)}</td>
      <td>${esc(r.Country)}<div class="sub">${esc(r.Mission)} mission</div></td>
      <td><span class="pill ${pill}">${esc(r.Status)}</span></td>
      <td class="mono sub">${esc(r.Created_On)}</td>
      <td class="mono">${r.Resolution_Days??'—'}</td>
      <td class="right"><button class="viewbtn" data-ref="${esc(r.Case_Ref)}">View</button></td></tr>`;
  }).join('');
  document.querySelectorAll('.viewbtn').forEach(b=>b.onclick=()=>openCase(b.dataset.ref));
}
let _qt;
$('#q').oninput=()=>{clearTimeout(_qt);_qt=setTimeout(()=>loadCases(0),300);};
['#f_country','#f_type','#f_flag','#f_status','#f_sort'].forEach(id=>$(id).onchange=()=>loadCases(0));
$('#f_clear').onclick=()=>{$('#q').value='';['#f_country','#f_type','#f_flag','#f_status'].forEach(id=>$(id).value='');$('#f_sort').value='newest';loadCases(0);};
$('#first').onclick=()=>loadCases(0);
$('#prev').onclick=()=>loadCases(page-1);
$('#next').onclick=()=>loadCases(page+1);

/* record */
async function openCase(ref){
  setView('cases'); document.querySelectorAll('.view').forEach(e=>e.classList.remove('show'));
  $('#v-rec').classList.add('show'); $('#pgcrumb').textContent='› '+ref;
  $('#recbody').innerHTML='<div class="loading">Loading case…</div>';
  const d=await (await fetch('/api/case?ref='+encodeURIComponent(ref))).json();
  if(d.error){$('#recbody').innerHTML='<div class="loading">Case not found.</div>';return;}
  const c=d.case, pill=pillCls(c.Case_Status);
  const STATUSES=['Pending','In Progress','On Hold','Closed'];
  const statusOpts=STATUSES.map(s=>`<option ${s===c.Case_Status?'selected':''}>${s}</option>`).join('');
  const flags=(c.L1_Situational_Flags||[]);
  const flagChips=flags.length?flags.map(f=>`<span class="chip ${FLAGCLS[f]||''}">${esc(f)}</span>`).join('')
    :'<span class="chip" style="color:var(--faint)">No situational flags</span>';
  const agencyChips=(c.L1_Agencies||[]).map(a=>`<span class="chip agency">${esc(a)}</span>`).join('');
  const stepsHtml=d.steps.length?d.steps.map(s=>`<li class="${s.done?'done':''}" data-idx="${s.idx}"><span class="box">${s.done?'✓':''}</span><span>${esc(s.text)}</span></li>`).join('')
    :'<li><span>No SOP found for this case type.</span></li>';
  const l2=[['Summary & pathway','L2_Summary_Pathway'],['Assistance requested vs provided','L2_Assistance_Req_vs_Provided'],
    ['Complications & delays','L2_Complications_Delays'],['External resources engaged','L2_External_Resources'],
    ['Lessons learnt','L2_Lessons_Learnt']].map(([t,k])=>`<div class="l2"><div class="t">${t}</div><p>${esc(c[k])}</p></div>`).join('');
  $('#recbody').innerHTML=`
    <button class="back" id="backbtn">← Back to cases</button>
    <div class="rechead"><h2>${esc(c.Case_Ref)}</h2><span class="pill ${pill}">${esc(c.Case_Status)}</span>
      <label class="statuslbl">Set status <select id="statusSel" class="fsel">${statusOpts}</select></label></div>
    <div class="recmeta"><span>${esc(c.Case_Type)}</span><span class="dot"></span><span>${esc(c.L1_Country)}</span>
      <span class="dot"></span><span>${esc(c.Assigned_HCG)} mission</span>
      ${c.Resolution_Days?`<span class="dot"></span><span>Resolved in <b class="mono">${c.Resolution_Days}</b> days</span>`:''}</div>
    <div class="recwrap">
      <div>
        <div class="card"><div class="hd">Case details</div><div class="bd">
          <div class="grid2">
            <div class="field"><div class="l">Case Ref</div><div class="v mono">${esc(c.Case_Ref)}</div></div>
            <div class="field"><div class="l">Case Type</div><div class="v">${esc(c.Case_Type)}</div></div>
            <div class="field"><div class="l">Handling Unit</div><div class="v">${esc(c.Case_Handler)}</div></div>
            <div class="field"><div class="l">Mission</div><div class="v">${esc(c.Assigned_HCG)}</div></div>
            <div class="field"><div class="l">Subject</div><div class="v"><span class="masked">🔒 ${esc(c.Title_Name)} <span class="locknote">PII masked</span></span></div></div>
            <div class="field"><div class="l">Resolution</div><div class="v mono">${c.Resolution_Days?c.Resolution_Days+' days':'—'}</div></div>
          </div>
          <div style="margin-top:14px"><div class="sectlabel">Tags</div><div class="chiprow"><span class="chip">🌏 ${esc(c.L1_Country)}</span>${agencyChips}${flagChips}</div></div>
          <div style="margin-top:16px"><div class="sectlabel">Description</div><p style="margin:0;font-size:13.5px">${esc(c.Case_Description)}</p></div>
        </div></div>
        <div class="card"><div class="hd">✅ Recommended next steps <span class="k" style="margin-left:auto">SOP · ${esc(c.Case_Type)}</span></div>
          <div class="bd"><ul class="steps" id="steps">${stepsHtml}</ul></div></div>
        <div class="card"><div class="hd">Analytical summary <span class="k" style="margin-left:auto">AI-generated · Layer 2</span></div>
          <div class="bd">${l2}</div></div>
      </div>
      <div class="card notes"><div class="hd">🗒️ Case notes <span class="k" style="margin-left:auto" id="ncount"></span></div>
        <div class="bd">
          <div class="composer"><textarea id="notebox" placeholder="Record a step taken or an update…"></textarea>
            <div class="row"><span class="hint">Posts as ${esc(window.__me||'officer')}</span><button class="primary" id="addnote">Add note</button></div></div>
          <div class="feed" id="feed"></div>
        </div></div>
    </div>`;
  $('#backbtn').onclick=()=>{setView('cases');};
  $('#statusSel').onchange=e=>setStatus(ref, e.target.value);
  document.querySelectorAll('#steps li[data-idx]').forEach(li=>li.onclick=()=>toggleStep(li, ref));
  $('#addnote').onclick=()=>addNote(ref);
  renderNotes(d.notes);
}
function renderNotes(notes){
  $('#ncount').textContent=notes.length?`${notes.length} note${notes.length>1?'s':''}`:'';
  $('#feed').innerHTML=notes.length?notes.map(n=>`<div class="note"><div class="av">${inits(n.author)}</div>
    <div class="body"><div class="meta"><b>${esc(n.author)}</b><span class="ts">${esc(n.created_at)}</span></div>
    <div class="txt">${esc(n.note)}</div></div></div>`).join(''):'<div class="empty">No notes yet.</div>';
}
async function addNote(ref){
  const t=$('#notebox'), b=$('#addnote'); if(!t.value.trim())return;
  b.disabled=true;
  const d=await (await fetch('/api/note',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ref,note:t.value.trim()})})).json();
  t.value=''; b.disabled=false; renderNotes(d.notes||[]);
}
function toggleStep(li, ref){
  const done=!li.classList.contains('done');
  li.classList.toggle('done', done);
  li.querySelector('.box').textContent=done?'✓':'';
  fetch('/api/step',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ref, step_idx:+li.dataset.idx, done})}).catch(()=>{});
}
function setStatus(ref, status){
  fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ref, status})}).then(()=>openCase(ref)).catch(()=>{});
}

/* ask — Genie-style conversation history + new chat */
let currentConv=null;
const SUGGESTS=[
  ["structured","How many cases by country?"],
  ["structured","Arrest & detention cases in Thailand where ICA was involved"],
  ["similar","Find similar scam cases in China"],
  ["procedure","What is the correct procedure for a lost passport?"],
];
const chatEl=()=>$('#chat');
const bubbleU=q=>`<div class="msg u"><div class="av">${inits(window.__me)}</div><div class="bubble">${esc(q)}</div></div>`;
const bubbleA=(route,ans)=>`<div class="msg a"><div class="av">C</div><div class="bubble">${route?`<span class="routetag">${esc(route)}</span>`:''}<div>${md(ans)}</div></div></div>`;
function emptyState(){
  chatEl().innerHTML=`<div class="emptyq"><h2>Ask the case corpus</h2>
    <p>Ask across cases (counts, trends), find <b>similar cases</b>, or ask for the correct <b>procedure</b>. Answers are cited.</p>
    <div class="suggests">`+SUGGESTS.map(s=>`<button class="suggest" data-q="${esc(s[1])}"><span class="k">${s[0]}</span>${esc(s[1])}</button>`).join('')+`</div></div>`;
  chatEl().querySelectorAll('.suggest').forEach(b=>b.onclick=()=>{$('#askin').value=b.dataset.q; ask();});
}
async function loadConvs(){
  try{
    const d=await (await fetch('/api/chats')).json();
    const c=d.chats||[];
    $('#convs').innerHTML=c.length?c.map(x=>`<button class="convitem ${x.conv_id===currentConv?'active':''}" data-id="${esc(x.conv_id)}" title="${esc(x.title)}">${esc(x.title)}</button>`).join('')
      :'<div class="convhdr" style="margin:6px 4px;text-transform:none">No chats yet</div>';
    $('#convs').querySelectorAll('.convitem').forEach(b=>b.onclick=()=>openConv(b.dataset.id));
  }catch(e){}
}
async function openConv(id){
  currentConv=id;
  try{
    const d=await (await fetch('/api/chat?conv_id='+encodeURIComponent(id))).json();
    chatEl().innerHTML=(d.messages||[]).map(m=>m.role==='user'?bubbleU(m.content):bubbleA(m.route,m.content)).join('');
    chatEl().scrollTop=chatEl().scrollHeight;
  }catch(e){}
  loadConvs();
}
function newChat(){currentConv=null; emptyState(); loadConvs(); $('#askin').focus();}
async function ask(){
  const inp=$('#askin'), q=inp.value.trim(); if(!q)return;
  inp.value='';
  if(chatEl().querySelector('.emptyq')) chatEl().innerHTML='';
  chatEl().insertAdjacentHTML('beforeend', bubbleU(q));
  const id='a'+Date.now();
  chatEl().insertAdjacentHTML('beforeend',`<div class="msg a"><div class="av">C</div><div class="bubble" id="${id}"><span class="loading" style="padding:0">Thinking…</span></div></div>`);
  chatEl().scrollTop=chatEl().scrollHeight;
  try{
    const body={question:q}; if(currentConv)body.conv_id=currentConv;
    const d=await (await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
    currentConv=d.conv_id;
    $('#'+id).innerHTML=`<span class="routetag">${esc(d.route)}</span><div>${md(d.answer)}</div>`;
    loadConvs();
  }catch(e){$('#'+id).innerHTML='Error contacting the assistant.';}
  chatEl().scrollTop=chatEl().scrollHeight;
}
$('#asksend').onclick=ask;
$('#askin').addEventListener('keydown',e=>{if(e.key==='Enter')ask();});
$('#newchat').onclick=newChat;

/* dashboard — illustrative figures (demo) */
let dashLoaded=false;
const PALETTE=['#3987e5','#d95926','#199e70','#c98500','#d55181','#9085e9','#008300','#e66767'];
const css=v=>getComputedStyle(document.body).getPropertyValue(v).trim();
function loadDash(){
  if(dashLoaded)return; dashLoaded=true;
  const box=$('#dashbody');
  if(typeof Chart==='undefined'){box.innerHTML='<div class="loading">Charts library unavailable in this environment.</div>';return;}
  const ink=css('--ink')||'#e8edf4', muted=css('--muted')||'#9aa7b8', surface=css('--surface')||'#161e2b';
  Chart.defaults.color=muted; Chart.defaults.borderColor='rgba(148,163,184,.14)';
  Chart.defaults.font.family="'IBM Plex Sans',system-ui,sans-serif"; Chart.defaults.font.size=12;
  Chart.defaults.plugins.legend.labels.usePointStyle=true; Chart.defaults.plugins.legend.labels.boxWidth=8;

  const months=['Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep'];
  const D={
    kpi:[
      {n:'1,284',k:'Total cases (12 mo)',d:'+6.2% vs prev',cls:'up',accent:'#3987e5'},
      {n:'342',k:'Open cases',d:'+18 this week',cls:'up',accent:'#c98500'},
      {n:'9.4d',k:'Avg resolution',d:'−1.2d vs prev',cls:'down',accent:'#199e70'},
      {n:'7',k:'SLA breaches',d:'−3 vs prev',cls:'down',accent:'#e66767'},
    ],
    newv:[86,92,78,120,104,138,96,110,124,142,118,131],
    resv:[74,88,81,102,110,121,99,105,118,126,120,128],
    types:{Scam:312,'Lost/Stolen Document':268,'Victim of Crime':201,'Serious Illness/Death':156,'Arrest & Detention':118,Evacuation:89},
    status:{Open:342,'In Progress':128,'On Hold':47,Closed:767},
    countries:{Thailand:214,China:187,Malaysia:156,Indonesia:143,'United Kingdom':98,Australia:76,Japan:64,India:58},
    res:{'Serious Illness/Death':14.2,'Arrest & Detention':12.6,'Victim of Crime':10.9,Evacuation:9.1,'Lost/Stolen Document':6.8,Scam:5.4},
    flags:{'Scam involvement':210,'Welfare concern':156,'Language barrier':98,'MP/POH escalation':42},
  };
  box.innerHTML=`
    <div class="kpirow">`+D.kpi.map(t=>`<div class="kpi" style="--kpi-accent:${t.accent}"><div class="n">${t.n}</div><div class="k">${t.k}</div><div class="delta ${t.cls}">${t.cls==='down'?'▼':'▲'} ${t.d}</div></div>`).join('')+`</div>
    <div class="charts">
      <div class="chartcard wide"><h3>Case volume over time</h3><div class="sub">New vs resolved, last 12 months</div><div class="canvas-wrap"><canvas id="c_trend"></canvas></div></div>
      <div class="chartcard"><h3>Cases by type</h3><div class="sub">Share of total caseload</div><div class="canvas-wrap"><canvas id="c_type"></canvas></div></div>
      <div class="chartcard"><h3>Cases by status</h3><div class="sub">Current pipeline</div><div class="canvas-wrap"><canvas id="c_status"></canvas></div></div>
      <div class="chartcard"><h3>Top countries by volume</h3><div class="sub">Where cases concentrate</div><div class="canvas-wrap"><canvas id="c_country"></canvas></div></div>
      <div class="chartcard"><h3>Avg resolution days by type</h3><div class="sub">Time to close</div><div class="canvas-wrap"><canvas id="c_res"></canvas></div></div>
      <div class="chartcard wide"><h3>Situational flags</h3><div class="sub">Volume by flag</div><div class="canvas-wrap" style="height:220px"><canvas id="c_flags"></canvas></div></div>
    </div>`;
  const grid={grid:{color:'rgba(148,163,184,.12)'}}, nogrid={grid:{display:false}};
  const el=id=>document.getElementById(id).getContext('2d');
  new Chart(el('c_trend'),{type:'line',data:{labels:months,datasets:[
    {label:'New',data:D.newv,borderColor:PALETTE[0],backgroundColor:'rgba(57,135,229,.15)',fill:true,tension:.35,pointRadius:0,borderWidth:2},
    {label:'Resolved',data:D.resv,borderColor:PALETTE[2],backgroundColor:'rgba(25,158,112,.12)',fill:true,tension:.35,pointRadius:0,borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top',align:'end'}},scales:{x:nogrid,y:{...grid,beginAtZero:true}}}});
  const donut=(id,obj)=>new Chart(el(id),{type:'doughnut',data:{labels:Object.keys(obj),datasets:[{data:Object.values(obj),backgroundColor:PALETTE,borderColor:surface,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'right'}}}});
  donut('c_type',D.types); donut('c_status',D.status);
  const hbar=(id,obj,color,unit='')=>new Chart(el(id),{type:'bar',data:{labels:Object.keys(obj),datasets:[{data:Object.values(obj),backgroundColor:color,borderRadius:5,barThickness:16}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.raw}${unit}`}}},scales:{x:{...grid,beginAtZero:true},y:nogrid}}});
  hbar('c_country',D.countries,PALETTE[0]);
  hbar('c_res',D.res,PALETTE[3],'d');
  new Chart(el('c_flags'),{type:'bar',data:{labels:Object.keys(D.flags),datasets:[{data:Object.values(D.flags),backgroundColor:[PALETTE[7],PALETTE[3],PALETTE[5],PALETTE[0]],borderRadius:5,barThickness:34}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:nogrid,y:{...grid,beginAtZero:true}}}});
}

fetch('/api/me').then(r=>r.json()).then(d=>{window.__me=d.email;$('#meid').textContent=d.email;$('#meav').textContent=inits(d.email);}).catch(()=>{window.__me='officer';});
loadFilters();
loadCases(0);
</script>
